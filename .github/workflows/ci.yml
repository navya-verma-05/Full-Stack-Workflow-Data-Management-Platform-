name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm --prefix server ci
      - name: Lint server
        run: npm --prefix server run lint
      - name: Check server formatting
        run: npm --prefix server run format:check
      - name: Run server tests (Vitest + mongodb-memory-server)
        run: npm --prefix server test

  client:
    name: Client Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install client dependencies
        run: npm --prefix client ci
      - name: Lint client
        run: npm --prefix client run lint
      - name: Check client formatting
        run: npm --prefix client run format:check
      - name: Run client tests (Vitest + Testing Library)
        run: npm --prefix client test
      - name: Build production bundle
        run: npm --prefix client run build

